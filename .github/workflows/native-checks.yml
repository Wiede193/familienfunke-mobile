name: Native App prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Expo prüfen und iOS-/Android-JS bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Expo-Paketversionen für den CI-Build abgleichen
        run: npx expo install --fix
      - name: Expo-Paketversionen prüfen
        run: npx expo install --check
      - name: KI-Startseite Navigation und Datenschutz prüfen
        run: npm run check:home
      - name: Einheitliches Farbdesign und Lesbarkeit prüfen
        run: npm run check:design
      - name: Barrierefreiheit für Navigation, Formulare und Screenreader prüfen
        run: npm run check:accessibility
      - name: Barrierefreie Artikelbeschreibungen und lokale Ortssuche prüfen
        run: npm run check:map-photo-a11y
      - name: Interaktive visuelle Kartensuche und Kartenmarker prüfen
        run: npm run check:interactive-map
      - name: Deutschlandweite Orts- und Adresssuche prüfen
        run: npm run check:geocoding
      - name: Server-Sicherheitsregeln auf Regressionen prüfen
        run: npm run check:security
      - name: Kistenmodus-UX prüfen
        run: npm run check:box-ux
      - name: Indexierte Familienbasar-Suche prüfen
        run: npm run check:market-search
      - name: KI-Freigabe und Fehlerbehandlung prüfen
        run: npm run check:market-auto-review
      - name: Automatische Wiederholung und Moderationsausnahmen prüfen
        run: npm run check:market-review-queue
      - name: iOS-Bundle erstellen
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Android-Bundle erstellen
        run: npx expo export --platform android --output-dir dist/android
