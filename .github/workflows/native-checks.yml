name: Native App prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Expo prüfen und iOS-/Android-JS bauen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Expo-Paketversionen prüfen
        run: npx expo install --check
      - name: Mehrsprachigkeit und unveränderte Funktions-IDs prüfen
        run: |
          node tests/check-locale.mjs
          node tests/check-market-locale.mjs
          node tests/check-family-life-locale.mjs
          node tests/check-play-english.mjs
          node tests/check-play-english-words.mjs
          node tests/check-map-guide-play-locale.mjs
          node tests/check-game-a11y-locale.mjs
      - name: Regional personalisierte Startseite prüfen
        run: node tests/check-home-highlights.mjs
      - name: Familienrunden und sicheres Teilen prüfen
        run: node tests/check-family-rounds.mjs
      - name: Begrenzte Startabfragen bei gleichzeitigen Anmeldungen prüfen
        run: node tests/check-startup-concurrency.mjs
      - name: KI-Startseite Navigation und Datenschutz prüfen
        run: npm run check:home
      - name: Kontobezogene Layout-Synchronisierung und RLS-Verträge prüfen
        run: npm run check:layout-sync
      - name: Entwürfe, Symbole, Statusmeldungen und Bildabrufe prüfen
        run: npm run check:ux-resilience
      - name: Datenschutz und Fallback der optionalen Spracheingabe prüfen
        run: npm run check:voice
      - name: Persönliche Startseite und Menüleiste prüfen
        run: npm run check:layout
      - name: Gemeinsame Bearbeitungs- und Löschaktionen prüfen
        run: npm run check:actions
      - name: Einheitliches Farbdesign und Lesbarkeit prüfen
        run: npm run check:design
      - name: Barrierefreiheit für Navigation, Formulare und Screenreader prüfen
        run: npm run check:accessibility
      - name: Barrierefreie Artikelbeschreibungen und lokale Ortssuche prüfen
        run: npm run check:map-photo-a11y
      - name: Interaktive visuelle Kartensuche und Kartenmarker prüfen
        run: npm run check:interactive-map
      - name: Deutschlandweite Orts- und Adresssuche prüfen
        run: npm run check:geocoding
      - name: Server-Sicherheitsregeln auf Regressionen prüfen
        run: npm run check:security
      - name: Zweiten Faktor und KI-Schutzgrenzen prüfen
        run: npm run check:mfa-ai
      - name: KI-Verbrauchserfassung prüfen
        run: npm run check:ai-usage
      - name: Freiwillige private Push-Benachrichtigungen prüfen
        run: npm run check:push
      - name: Benachrichtigungszentrale und Löschrechte prüfen
        run: npm run check:inbox
      - name: Familienausflugsplaner prüfen
        run: npm run check:outing
      - name: Gespeicherte Basar-Suchaufträge prüfen
        run: npm run check:saved-searches
      - name: Preisalarme für gemerkte Artikel prüfen
        run: npm run check:price-alerts
      - name: Privaten Familienkalender prüfen
        run: npm run check:calendar
      - name: Familienquiz und Spielideen prüfen
        run: npm run check:play
      - name: Kistenmodus-UX prüfen
        run: npm run check:box-ux
      - name: Indexierte Familienbasar-Suche prüfen
        run: npm run check:market-search
      - name: KI-Freigabe und Fehlerbehandlung prüfen
        run: npm run check:market-auto-review
      - name: Automatische Wiederholung und Moderationsausnahmen prüfen
        run: npm run check:market-review-queue
      - name: iOS-Bundle erstellen
        run: npx expo export --platform ios --output-dir dist/ios
      - name: Android-Bundle erstellen
        run: npx expo export --platform android --output-dir dist/android
