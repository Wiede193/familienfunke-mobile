name: Familienbasar SQL prüfen

on:
  pull_request:
    branches: [main]
    paths:
      - 'database/ff_market_partner_beta.sql'
      - '.github/workflows/mobile-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check marketplace SQL source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql = Path('database/ff_market_partner_beta.sql').read_text()
          for name in ('ff_organizations', 'ff_market_listings', 'ff_partner_events'):
              assert sql.count(f'create table if not exists public.{name}') == 1, f'{name} must be defined once'
          assert "[.]jpg$'" in sql, 'Photo path regex is incomplete'
          assert 'l.photo_path is null' in sql, 'Private photo upload policy must require a pending listing'
          assert 'create policy ff_market_photos_read' in sql, 'Image read policy missing'
          assert 'moderation_status=\'approved\'' in sql, 'Only approved listings should be publicly readable'
          print('Schema source checks passed')
          PY
