name: Resolve Expo safe area dependency
on:
  push:
    branches: [qa/safe-area-dependency]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx expo install react-native-safe-area-context --npm
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
      - run: npx expo install --check react-native-safe-area-context
        continue-on-error: true
        env:
          CI: '1'
      - run: |
          node -e "console.log(require('./node_modules/expo/bundledNativeModules.json')['react-native-safe-area-context']);console.log(require('./package.json').dependencies['react-native-safe-area-context'])"
          mkdir -p dependency-result
          cp package.json package-lock.json dependency-result/
      - uses: actions/upload-artifact@v4
        with:
          name: expo-safe-area-lockfiles
          path: dependency-result/
          retention-days: 7
