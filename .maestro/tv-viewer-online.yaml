appId: de.familienfunke.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Alles mit einer Suche finden|Quickstep isn't responding"
    timeout: 60000
- runFlow:
    when:
      visible: "Quickstep isn't responding"
    commands:
      - takeScreenshot: 00-launcher
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Alles mit einer Suche finden"
    timeout: 30000
- tapOn: "Tour überspringen"
- extendedWaitUntil:
    visible: "Hallo, Testfamilie!"
    timeout: 30000
- tapOn: "Familienfunke durchsuchen oder Wissensfrage stellen"
- inputText: "YouTube"
- hideKeyboard
- extendedWaitUntil:
    visible: "Familienfunke TV öffnen"
    timeout: 15000
- tapOn: "Familienfunke TV öffnen"
- extendedWaitUntil:
    visible: "Personalisierung aus.*"
    timeout: 15000
- takeScreenshot: 01-TV-online
- tapOn: "Videos suchen"
- inputText: "Rogge"
- hideKeyboard
- scrollUntilVisible:
    element: "Autoplay"
    direction: DOWN
- tapOn: "Autoplay"
- scrollUntilVisible:
    element: "Programm starten"
    direction: DOWN
- tapOn: "Programm starten"
- assertVisible: "YouTube laden?"
- tapOn: "YouTube laden"
- extendedWaitUntil:
    visible: "QA: Wiedergabezeit steigt"
    timeout: 90000
- takeScreenshot: 02-echte-Wiedergabe
- scrollUntilVisible:
    element: "Player schließen"
    direction: DOWN
- tapOn: "Player schließen"
- extendedWaitUntil:
    visible: "Videos suchen"
    timeout: 15000
- assertNotVisible: "QA: Wiedergabezeit steigt"
- takeScreenshot: 03-Player-geschlossen
