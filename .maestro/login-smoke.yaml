appId: de.familienfunke.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Willkommen zurück!"
    timeout: 60000
- takeScreenshot: 01-anmeldung
- scrollUntilVisible:
    element:
      text: "Anmelden"
    direction: DOWN
- tapOn: "Anmelden"
- assertVisible: "Bitte E-Mail und Passwort eingeben."
- takeScreenshot: 02-validierung
- scrollUntilVisible:
    element:
      text: "Anmeldung, Einladung & Hilfe"
    direction: DOWN
- tapOn: "Anmeldung, Einladung & Hilfe"
- assertVisible: "Hilfe zur Anmeldung"
- takeScreenshot: 03-anmeldehilfe
- tapOn: "← Zur Anmeldung"
- assertVisible: "Willkommen zurück!"
- takeScreenshot: 04-zurueck
